databases:
  # Free managed PostgreSQL — data persists across deploys
  - name: grs-purchase-db
    plan: free
    region: singapore
    databaseName: grs_purchase
    user: grs_user

services:
  # Backend NestJS API Service
  - type: web
    name: grs-purchase-backend
    env: node
    region: singapore
    plan: free
    repo: https://github.com/sunilnagaragatta/grs-purchase-management.git
    branch: main
    buildCommand: cd backend && npm install --include=dev && npm run build && npx prisma migrate deploy && npx prisma db seed
    startCommand: cd backend && npm run start:prod
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: DATABASE_URL
        fromDatabase:
          name: grs-purchase-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://grs-purchase-frontend.onrender.com

  # Frontend Vite React Static Site
  - type: web
    name: grs-purchase-frontend
    env: static
    repo: https://github.com/sunilnagaragatta/grs-purchase-management.git
    branch: main
    buildCommand: cd frontend && npm install --include=dev && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: VITE_API_URL
        value: https://grs-purchase-backend.onrender.com/api
