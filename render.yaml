databases:
  # Free managed PostgreSQL — data persists across deploys
  - name: grs-purchase-db
    plan: free
    region: singapore
    databaseName: grs_purchase
    user: grs_user

services:
  # Backend NestJS API Service
  - type: web
    name: grs-purchase-backend
    env: node
    region: singapore
    plan: free
    buildCommand: cd backend && npm install && npm run build && npx prisma db push && npx prisma db seed
    startCommand: cd backend && npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: PRISMA_USER_CONSENT_FOR_DANGEROUS_AI_ACTION
        value: true
      - key: DATABASE_URL
        fromDatabase:
          name: grs-purchase-db
          property: connectionString
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: grs-purchase-frontend
          property: host

  # Frontend Vite React Static Site
  - type: web
    name: grs-purchase-frontend
    env: static
    region: singapore
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: grs-purchase-backend
          property: url
