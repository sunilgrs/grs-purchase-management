# Render Blueprint — GRS Purchase Management
#
# Provisions:
#   1. grs-purchase-db      — managed PostgreSQL (data persists across deploys)
#   2. grs-purchase-api     — NestJS API web service
#   3. grs-purchase-web     — React/Vite static site
#
# Database          Backend              Frontend
#   Render Postgres <- DATABASE_URL <- NestJS API <- VITE_API_URL <- React (static)

databases:
  - name: grs-purchase-db
    plan: free
    region: singapore
    databaseName: grs_purchase
    user: grs_user
    ipAllowList: [] # allow only from Render services

services:
  # --------------------------------------------------------------------------
  # Backend — NestJS API (all routes under /api)
  # --------------------------------------------------------------------------
  - type: web
    name: grs-purchase-api
    env: node
    region: singapore
    plan: free
    repo: https://github.com/sunilgrs/grs-purchase-management.git
    branch: main
    healthCheckPath: /api/health
    buildCommand: |
      cd backend &&
      npm install --include=dev &&
      npm run build &&
      npx prisma migrate deploy &&
      npx prisma db seed
    startCommand: cd backend && npm run start:prod
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      # Render injects PORT automatically — do not set it here.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: DATABASE_URL
        fromDatabase:
          name: grs-purchase-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://grs-purchase-web.onrender.com

  # --------------------------------------------------------------------------
  # Frontend — React/Vite static site
  # --------------------------------------------------------------------------
  - type: web
    name: grs-purchase-web
    env: static
    plan: free
    repo: https://github.com/sunilgrs/grs-purchase-management.git
    branch: main
    buildCommand: |
      cd frontend &&
      npm install --include=dev &&
      npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "24"
      # Vite inlines this at build time; must be the final backend URL.
      - key: VITE_API_URL
        value: https://grs-purchase-api.onrender.com/api