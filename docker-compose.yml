name: grs-purchase-management

services:
  backend:
    build: ./backend
    container_name: grs-backend
    restart: unless-stopped
    environment:
      # Stored in the `grs-data` volume at /app/data/grs.db
      DATABASE_URL: file:./data/grs.db
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:-please-change-me}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://localhost,https://127.0.0.1,http://localhost:8080,http://127.0.0.1:8080}
    volumes:
      - grs-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build: ./frontend
    container_name: grs-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      # Lets the phone download the Android APK straight from the app
      - ./mobile/apk:/usr/share/nginx/html/apk:ro

  caddy:
    image: caddy:2-alpine
    container_name: grs-caddy
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_started
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
      TLS_INTERNAL: ${TLS_INTERNAL:-internal}
      LAN_IP: ${LAN_IP:-192.168.1.33}
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  grs-data:
  caddy_data:
  caddy_config:
